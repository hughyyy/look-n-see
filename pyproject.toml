[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "look-n-see"
version = "0.1.0"
description = "MCP server exposing vision models (describe/analyze/ask about images) via OpenRouter and HuggingFace Inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "vision", "ocr", "openrouter", "huggingface", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2",
    "huggingface_hub>=0.24",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/hughyyy/look-n-see"
Issues = "https://github.com/hughyyy/look-n-see/issues"

[project.scripts]
look-n-see = "look_n_see.server:main"

[project.optional-dependencies]
# Local OCR engine (otherwise extract_text uses the vlm engine by default).
# rapidocr-onnxruntime caps at <3.13; newer Pythons fall back to the 1.2 line.
ocr = [
    "rapidocr-onnxruntime>=1.4; python_version < '3.13'",
    "rapidocr-onnxruntime>=1.2; python_version >= '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]
