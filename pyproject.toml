[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "look-n-see"
version = "0.1.0"
description = "MCP server exposing vision models (describe/analyze/ask about images) via OpenRouter and HuggingFace Inference"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
    "huggingface_hub>=0.24",
    "httpx>=0.27",
]

[project.scripts]
look-n-see = "look_n_see.server:main"

[tool.setuptools.packages.find]
where = ["src"]
